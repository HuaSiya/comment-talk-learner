# B站 + 贴吧学说话插件配置示例
# 复制为 config.toml 后修改；WebUI 插件配置页也可以直接改。
# 公共设置放 [plugin]；B站抓取参数放 [sources]；贴吧参数放 [tieba]。

[plugin]
config_version = "1.0.0"
enabled = true
write_to_db = true
daily_enabled = true
daily_hour = 4
daily_minute = 30
jitter_minutes = 20
run_on_start_if_missed = true

max_expressions_per_day = 8
max_total_imported = 800

min_confidence = 0.6
review_enabled = true
review_min_score = 0.65

llm_task = "learner"
llm_fallback_task = "utils"
llm_batch_size = 40
llm_timeout_seconds = 180
max_candidates_per_call = 4

seen_video_ttl_days = 14
max_retries_per_day = 2
retry_interval_minutes = 30
command_cooldown_seconds = 300

banned_words = []
admin_users = []

[sources]
popular_enabled = true
popular_pages = 1
zone_rids = []
keywords = []
up_uids = []
bvids = []
per_source_limit = 5  # 每个指定来源最多几个候选；热门会多取一些补位
max_video_age_days = 30

max_videos_per_run = 6   # 每轮最多保留几个达标视频；不足会继续找下一个
max_comments_per_video = 40  # 过滤后每视频至少要有多少条有效评论；不足则跳过该视频
include_sub_replies = true
sub_reply_roots = 3
sub_replies_per_root = 20
min_reply_count = 50     # 视频评论数必须 >50 才取样（即 51 条及以上）
min_comment_chars = 4
max_comment_chars = 120
formulaic_filter = true
reaction_keep_ratio = 0.08
ai_bot_threshold = 60
rate_limit_seconds = 1.5
request_timeout = 20.0
max_request_retries = 2
sessdata = ""

[tieba]
enabled = true
quality_filter = true  # 过滤公式化/玩梗/广告/AI/无意义楼层
bars = ["生活吧"]
max_bars = 10
keywords = []
scan_pages = 2
max_threads = 0        # 达标帖子总数；0=每吧达标帖子数×吧数
threads_per_bar = 2    # 每吧最多保留几个达标帖子
thread_pages = 1       # 每帖至少翻几页；系统会按目标加 1-2 页缓冲
min_replies = 50       # 帖子回复数必须 >50（51 条及以上）
max_posts_per_thread = 30  # 过滤后每帖至少保留多少条有效楼层；建议比回复数下限低 5-10 层
min_post_chars = 6
max_post_chars = 300
include_op = false
exclude_title = "水楼|签到|吧规|公告|广告|交易|招聘|投诉|申精|回复"
rate_limit_seconds = 2.0
request_timeout = 20.0
max_request_retries = 2
cookie = ""
proxy = ""
transport = "auto"
